<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Dynamic viewport setting to prevent scaling issues on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jeu Arcade Responsive</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Utilisation des unités dynamiques iOS + gestion des zones sûres (Notch & Home Bar) */
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(15px, env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      overflow: hidden;
      touch-action: none;
    }

    header {
      text-align: center;
      padding: 5px 0;
      flex-shrink: 0;
    }

    .score-board {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Container flexible pour le Canvas */
    .game-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px; /* Limite la taille sur grand écran */
      padding: 5px;
      min-height: 0; /* Important pour que Flexbox réduise le canvas si besoin */
    }

    canvas {
      background-color: #000;
      border: 2px solid #333;
      border-radius: 8px;
      
      /* Redimensionnement automatique responsive */
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* Control Panel / D-Pad */
    .controls {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding-top: 5px;
    }

    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 180px;
      height: 180px;
    }

    .d-btn {
      background: #222;
      border: 1px solid #444;
      border-radius: 12px;
      color: #fff;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.05s;
      -webkit-tap-highlight-color: transparent;
    }

    .d-btn:active, .d-btn.active {
      background: #555;
      transform: scale(0.95);
    }

    /* Positionnement des boutons dans la grille 3x3 */
    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-left  { grid-column: 1; grid-row: 2; }
    .btn-center{ grid-column: 2; grid-row: 2; background: #181818; border-color: #333; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down  { grid-column: 2; grid-row: 3; }

    /* Ajustement spécifique pour petits écrans en hauteur */
    @media (max-height: 667px) {
      .d-pad {
        width: 140px;
        height: 140px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="score-board">SCORE: <span id="score">0</span></div>
  </header>

  <main class="game-container">
    <!-- Définition de la résolution interne fixe du jeu -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>
  </main>

  <footer class="controls">
    <div class="d-pad">
      <button class="d-btn btn-up" id="btn-up">▲</button>
      <button class="d-btn btn-left" id="btn-left">◄</button>
      <div class="d-btn btn-center"></div>
      <button class="d-btn btn-right" id="btn-right">►</button>
      <button class="d-btn btn-down" id="btn-down">▼</button>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    // Maintien de l'état des entrées
    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false
    };

    // Gestion tactile (D-Pad)
    function bindTouchControl(buttonId, keyName) {
      const btn = document.getElementById(buttonId);

      const handlePress = (e) => {
        e.preventDefault();
        keys[keyName] = true;
        btn.classList.add('active');
      };

      const handleRelease = (e) => {
        e.preventDefault();
        keys[keyName] = false;
        btn.classList.remove('active');
      };

      btn.addEventListener('touchstart', handlePress, { passive: false });
      btn.addEventListener('touchend', handleRelease, { passive: false });
      btn.addEventListener('mousedown', handlePress);
      btn.addEventListener('mouseup', handleRelease);
      btn.addEventListener('mouseleave', handleRelease);
    }

    bindTouchControl('btn-up', 'ArrowUp');
    bindTouchControl('btn-down', 'ArrowDown');
    bindTouchControl('btn-left', 'ArrowLeft');
    bindTouchControl('btn-right', 'ArrowRight');

    // Support Clavier Mac / PC
    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = true;
        highlightDpad(e.key, true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = false;
        highlightDpad(e.key, false);
      }
    });

    function highlightDpad(key, isActive) {
      const map = {
        ArrowUp: 'btn-up',
        ArrowDown: 'btn-down',
        ArrowLeft: 'btn-left',
        ArrowRight: 'btn-right'
      };
      if (map[key]) {
        const btn = document.getElementById(map[key]);
        if (isActive) btn.classList.add('active');
        else btn.classList.remove('active');
      }
    }

    // Exemple de boucle de rendu minimale
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Fond de démonstration
      ctx.fillStyle = "#222";
      ctx.fillRect(10, 10, canvas.width - 20, canvas.height - 20);

      ctx.fillStyle = "#00ffcc";
      ctx.font = "16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Ecran optimisé pour iPhone 15 Pro", canvas.width / 2, canvas.height / 2);

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
