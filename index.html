<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Snake - iPhone 15 Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(15px, env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      overflow: hidden;
      touch-action: none;
    }

    header {
      text-align: center;
      padding: 5px 0;
      flex-shrink: 0;
    }

    .score-board {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .game-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      padding: 5px;
      min-height: 0;
    }

    canvas {
      background-color: #000;
      border: 2px solid #333;
      border-radius: 8px;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .controls {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding-top: 5px;
    }

    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 180px;
      height: 180px;
    }

    .d-btn {
      background: #222;
      border: 1px solid #444;
      border-radius: 12px;
      color: #fff;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.05s;
      -webkit-tap-highlight-color: transparent;
    }

    .d-btn:active, .d-btn.active {
      background: #555;
      transform: scale(0.95);
    }

    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-left  { grid-column: 1; grid-row: 2; }
    .btn-center{ grid-column: 2; grid-row: 2; background: #181818; border-color: #333; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down  { grid-column: 2; grid-row: 3; }

    @media (max-height: 667px) {
      .d-pad {
        width: 140px;
        height: 140px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="score-board">SCORE: <span id="score">0</span></div>
  </header>

  <main class="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
  </main>

  <footer class="controls">
    <div class="d-pad">
      <button class="d-btn btn-up" id="btn-up">▲</button>
      <button class="d-btn btn-left" id="btn-left">◄</button>
      <div class="d-btn btn-center"></div>
      <button class="d-btn btn-right" id="btn-right">►</button>
      <button class="d-btn btn-down" id="btn-down">▼</button>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    // --- LOGIQUE DU JEU SNAKE ---
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameInterval = null;
    let gameStarted = false;

    function startGame() {
      if (!gameStarted) {
        gameStarted = true;
        dx = 1; // Démarre vers la droite
        dy = 0;
        gameInterval = setInterval(gameStep, 100);
      }
    }

    function changeDirection(newDx, newDy) {
      if (!gameStarted) startGame();
      // Empêche le demi-tour direct
      if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return;
      dx = newDx;
      dy = newDy;
    }

    function gameStep() {
      // Déplacement de la tête
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Collision avec les murs ou soi-même
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkSelfCollision(head)) {
        resetGame();
        return;
      }

      snake.unshift(head);

      // Manger la nourriture
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function checkSelfCollision(head) {
      return snake.some(segment => segment.x === head.x && segment.y === head.y);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }

    function resetGame() {
      alert(`Game Over ! Score final : ${score}`);
      clearInterval(gameInterval);
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      score = 0;
      scoreEl.textContent = score;
      gameStarted = false;
      spawnFood();
      draw();
    }

    function draw() {
      // Fond du terrain
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Nourriture
      ctx.fillStyle = '#ff4757';
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

      // Snake
      ctx.fillStyle = '#2ed573';
      snake.forEach((segment, index) => {
        // Tête légèrement plus claire
        if (index === 0) ctx.fillStyle = '#7bed9f';
        else ctx.fillStyle = '#2ed573';
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      });

      // Message de démarrage
      if (!gameStarted) {
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Appuie sur une flèche pour jouer', canvas.width / 2, canvas.height / 2);
      }
    }

    // --- GESTION DES COMMANDES (TACTILE & CLAVIER) ---
    function bindTouchControl(buttonId, action) {
      const btn = document.getElementById(buttonId);

      const handlePress = (e) => {
        e.preventDefault();
        action();
        btn.classList.add('active');
      };

      const handleRelease = (e) => {
        e.preventDefault();
        btn.classList.remove('active');
      };

      btn.addEventListener('touchstart', handlePress, { passive: false });
      btn.addEventListener('touchend', handleRelease, { passive: false });
      btn.addEventListener('mousedown', handlePress);
      btn.addEventListener('mouseup', handleRelease);
    }

    bindTouchControl('btn-up', () => changeDirection(0, -1));
    bindTouchControl('btn-down', () => changeDirection(0, 1));
    bindTouchControl('btn-left', () => changeDirection(-1, 0));
    bindTouchControl('btn-right', () => changeDirection(1, 0));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') { changeDirection(0, -1); highlightDpad('btn-up'); }
      if (e.key === 'ArrowDown') { changeDirection(0, 1); highlightDpad('btn-down'); }
      if (e.key === 'ArrowLeft') { changeDirection(-1, 0); highlightDpad('btn-left'); }
      if (e.key === 'ArrowRight') { changeDirection(1, 0); highlightDpad('btn-right'); }
    });

    window.addEventListener('keyup', () => {
      document.querySelectorAll('.d-btn').forEach(btn => btn.classList.remove('active'));
    });

    function highlightDpad(id) {
      const btn = document.getElementById(id);
      if (btn) btn.classList.add('active');
    }

    // Premier rendu au chargement
    draw();
  </script>
</body>
</html>
